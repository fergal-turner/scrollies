<script>
(function () {
  // scale each figure (rendered at native size) to fit its column and the viewport height
  var wraps = document.querySelectorAll('.sc-iframe-wrap');
  function fit() {
    wraps.forEach(function (w) {
      var nw = +w.dataset.w, nh = +w.dataset.h;
      var scale = Math.min(1, w.parentElement.clientWidth / nw, (window.innerHeight * 0.8) / nh);
      var f = w.firstElementChild;
      f.style.transform = 'scale(' + scale + ')';
      w.style.width = nw * scale + 'px';
      w.style.height = nh * scale + 'px';
    });
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
})();
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var targets = document.querySelectorAll('.sc-text, .sc-fig');
  if (reduce || !('IntersectionObserver' in window)) {
    targets.forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }
  document.documentElement.classList.add('sc-js');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
  targets.forEach(function (el) { io.observe(el); });
})();
</script>
